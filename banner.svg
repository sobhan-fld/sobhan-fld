<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sobhan Fooladi Mahani, AI Research Engineer and CTO, with a year of GitHub activity drawn as rising bars">
  <defs>
    <radialGradient id="glowA"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.32"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect width="1200" height="300" rx="28"/></clipPath>
  </defs>
  <style>
    .glow-a { animation: drift-a 18s ease-in-out infinite alternate; }
    .glow-b { animation: drift-b 22s ease-in-out infinite alternate; }
    .rise { transform-box: fill-box; transform-origin: 50% 100%; animation: rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 2.8s ease-in-out infinite alternate; }
    .intro { animation: intro 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .intro-2 { animation-delay: 0.12s; }
    @keyframes drift-a { from { transform: translate(0, 0); } to { transform: translate(160px, 40px); } }
    @keyframes drift-b { from { transform: translate(0, 0); } to { transform: translate(-200px, -30px); } }
    @keyframes rise { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
    @keyframes breathe { from { transform: scaleY(1); } to { transform: scaleY(0.82); } }
    @keyframes intro { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
